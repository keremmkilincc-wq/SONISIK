<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SON IŞIK - 3D FPS Korku</title>
<link rel="stylesheet" href="assets/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <div id="battery">🔋 <span id="batteryVal">100</span>%</div>
  <div id="hint">WASD + Mouse | F: Fener | ESC: Çık</div>
</div>
<div id="crosshair">+</div>
<div id="overlay">
  <h1>SON IŞIK</h1>
  <p>Pil bitmeden çıkışı bul. Yaratık karanlıkta avlanır.</p>
  <button id="startBtn">OYNA</button>
  <p class="sub">Tıkla ve kilitle → WASD hareket, Mouse bakış</p>
</div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
